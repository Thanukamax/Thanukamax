<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="100%" height="6" fill="none">
  <defs>
    <linearGradient id="castorice-div" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0" />
      <stop offset="15%" stop-color="#A855F7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="1" />
      <stop offset="75%" stop-color="#F472B6" stop-opacity="0.8" />
      <stop offset="90%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="20" y="1.5" width="760" height="3" rx="1.5" fill="url(#castorice-div)" filter="url(#glow)" />
